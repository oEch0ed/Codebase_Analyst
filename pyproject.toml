[project]
name = "codebase-analyst"
version = "0.1.0"
description = "Agentic, code-aware RAG over Git repositories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.4.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

[project.scripts]
analyst = "analyst.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

# ---------- tooling ----------

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "UP", "TC"]
ignore = ["ANN401"]  # allow explicit Any

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
allow-star-arg-any = true

[tool.ruff.lint.flake8-type-checking]
# pydantic needs field types at runtime — never move them under TYPE_CHECKING
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
